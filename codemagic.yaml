workflows:
  moviedb-trollstore:
    name: TheMovieDbApp - TrollStore IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default
      vars:
        APP_NAME: TheMovieDbApp
        SCHEME: TheMovieDbApp

    scripts:
      - name: Locate project
        script: |
          set -e
          echo "Repository files:"
          ls -la

          is_valid() {
            [ -f "$1/Podfile" ] && [ -f "$1/$APP_NAME.xcodeproj/project.pbxproj" ] && [ -d "$1/$APP_NAME" ]
          }

          PROJECT_DIR=""

          for PODFILE in $(find . -maxdepth 3 -name Podfile -not -path './Pods/*' -not -path './work/*'); do
            DIR="$(dirname "$PODFILE")"
            if is_valid "$DIR"; then PROJECT_DIR="$DIR"; break; fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: could not find a complete project (Podfile + $APP_NAME.xcodeproj + $APP_NAME folder)."
            exit 1
          fi

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/.project_dir"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Prepare project for unsigned TrollStore build
        script: |
          set -e
          cd "$(cat "$CM_BUILD_DIR/.project_dir")"

          cat > Podfile <<'PODEOF'
          platform :ios, '16.0'
          project 'TheMovieDbApp.xcodeproj'

          target 'TheMovieDbApp' do
            use_frameworks!

            pod 'Alamofire'
            pod 'SDWebImage'
            pod "youtube-ios-player-helper"
            pod 'Locksmith'
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              end
            end
          end
          PODEOF

          if [ ! -f TrollStore.entitlements ]; then
          cat > TrollStore.entitlements <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>com.ArtemTkachenko.TheMovieDbApp</string>
              <key>keychain-access-groups</key>
              <array>
                  <string>com.ArtemTkachenko.TheMovieDbApp</string>
              </array>
              <key>get-task-allow</key>
              <false/>
          </dict>
          </plist>
          ENTEOF
          fi

          SCHEME_DIR="$APP_NAME.xcodeproj/xcshareddata/xcschemes"
          if [ ! -f "$SCHEME_DIR/$SCHEME.xcscheme" ]; then
            TARGET_ID="$(grep -m1 -B1 'isa = PBXNativeTarget' "$APP_NAME.xcodeproj/project.pbxproj" | head -n1 | awk '{print $1}')"
            echo "Target id: $TARGET_ID"
            mkdir -p "$SCHEME_DIR"
          cat > "$SCHEME_DIR/$SCHEME.xcscheme" <<SCHEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion = "1400" version = "1.3">
             <BuildAction parallelizeBuildables = "YES" buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting = "YES" buildForRunning = "YES" buildForProfiling = "YES" buildForArchiving = "YES" buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "$TARGET_ID"
                         BuildableName = "$APP_NAME.app"
                         BlueprintName = "$APP_NAME"
                         ReferencedContainer = "container:$APP_NAME.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <LaunchAction buildConfiguration = "Release" selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle = "0" useCustomWorkingDirectory = "NO" ignoresPersistentStateOnLaunch = "NO" debugDocumentVersioning = "YES" debugServiceExtension = "internal" allowLocationSimulation = "YES">
             </LaunchAction>
             <ArchiveAction buildConfiguration = "Release" revealArchiveInOrganizer = "YES">
             </ArchiveAction>
          </Scheme>
          SCHEOF
          fi
          ls -la

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd "$(cat "$CM_BUILD_DIR/.project_dir")"
          pod install --repo-update
          test -d "$APP_NAME.xcworkspace"

      - name: Build unsigned iOS app
        script: |
          set -e
          cd "$(cat "$CM_BUILD_DIR/.project_dir")"
          xcodebuild \
            -workspace "$APP_NAME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Verify app bundle
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP_PATH" || { echo "ERROR: $APP_NAME.app was not generated."; exit 1; }
          plutil -p "$APP_PATH/Info.plist" | grep -E "CFBundleExecutable|CFBundleIdentifier|MinimumOSVersion" || true
          lipo -info "$APP_PATH/$APP_NAME"
          ls "$APP_PATH/Frameworks" || echo "No Frameworks folder"

      - name: Add entitlements for TrollStore (ldid)
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/$APP_NAME.app"
          ENT="$(cat "$CM_BUILD_DIR/.project_dir")/TrollStore.entitlements"
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid || true
          fi
          if command -v ldid >/dev/null 2>&1 && [ -f "$ENT" ]; then
            ldid -S"$ENT" "$APP_PATH/$APP_NAME"
            ldid -e "$APP_PATH/$APP_NAME" || true
          else
            echo "WARNING: ldid or entitlements file missing - continuing without entitlements."
          fi

      - name: Package IPA for TrollStore
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/$APP_NAME.app"
          cd "$CM_BUILD_DIR"
          rm -rf Payload "$APP_NAME.ipa" "$APP_NAME.tipa"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$APP_NAME.ipa" Payload
          cp "$APP_NAME.ipa" "$APP_NAME.tipa"
          ls -lh "$APP_NAME.ipa" "$APP_NAME.tipa"

    artifacts:
      - TheMovieDbApp.ipa
      - TheMovieDbApp.tipa
